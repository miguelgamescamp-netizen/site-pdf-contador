<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento de Pesquisa Final</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f0f3f6;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        /* Remove o bloco do contador visual que falhou */
        .contador-display {
            display: none; 
        }
        
        .btn-acesso {
            display: block;
            width: 80%;
            padding: 15px 30px;
            margin: 50px auto 10px;
            background-color: #e74c3c; 
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn-acesso:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Documento de Pesquisa Final</h1>
    <p>Clique abaixo para baixar o arquivo completo e registrar seu acesso.</p>
    
    <button 
       class="btn-acesso" 
       id="pdf-download-button">
        BAIXAR PDF COMPLETO
    </button>

</div>

<script>
    // ✅ LINK DE ENVIO: CORRETO
    const FORM_ACTION_URL = 'https://docs.google.com/forms/u/0/d/e/1FAIpQLSf2gJsj_O3eipN2jWrYp-QVKj-V1KQ7EJwCS_b5FoEpxoUDTg/formResponse'; 
    
    // ✅ CÓDIGO DE ENTRADA: CORRETO E ENCONTRADO
    const ENTRY_CODE = 'entry.1166318556'; 
    
    // Link final do PDF
    const PDF_URL = 'https://docs.google.com/spreadsheets/d/1ycPzz1Mw7dylkRGDqkBJj7B0OoqdGbBM/edit?usp=sharing&ouid=107411067002152538962&rtpof=true&sd=true';

    document.getElementById('pdf-download-button').addEventListener('click', function() {
        
        // 1. GERA UM REGISTRO DE DATA E HORA
        const timestamp = new Date().toLocaleString('pt-BR');
        
        // 2. CONSTRÓI OS DADOS PARA ENVIAR À PLANILHA
        const data = new FormData();
        data.append(ENTRY_CODE, timestamp); 

        // 3. ENVIA OS DADOS PARA A PLANILHA (ASSÍNCRONO - não bloqueia a navegação)
        fetch(FORM_ACTION_URL, {
            method: 'POST',
            body: data,
            mode: 'no-cors' 
        })
        .then(response => {
            console.log('Registro de clique enviado com sucesso.', response);
        })
        .catch(error => {
            console.error('Erro ao registrar o clique:', error);
        });

        // 4. ABRE O PDF IMEDIATAMENTE APÓS ENVIAR O DADO
        setTimeout(() => {
            window.open(PDF_URL, '_blank');
        }, 100); 
    });
</script>

</body>
</html>
