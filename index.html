<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento de Pesquisa Final</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f0f3f6;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .contador-display {
            font-size: 20px;
            color: #666;
            margin: 25px 0;
            padding: 15px;
            border: 2px solid #0aa2c0;
            border-radius: 8px;
            background-color: #e6f7fa;
            /* Flexbox para centralizar o texto e a imagem */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #contador-imagem {
            /* Estilo para garantir que o número da imagem seja grande */
            width: 100%;
            height: auto;
            max-width: 150px; 
            margin: 5px 0;
            display: block; 
        }
        
        .btn-acesso {
            display: block;
            width: 80%;
            padding: 15px 30px;
            margin: 30px auto 10px;
            background-color: #e74c3c; 
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn-acesso:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Documento de Pesquisa Final</h1>
    <p>Baixe o arquivo PDF completo e confira o total de acessos:</p>

    <div class="contador-display">
        <img id="contador-imagem" 
             src="https://counter2.optimizermagazine.com/hit.php?id=miguelpereiracontador&color=white" 
             alt="Contador de Acessos">
        
        <span style="font-size: 14px; color: #777; margin-top: 10px;">
            pessoas visitaram este documento (Aproximado)
        </span>
    </div>

    <a href="https://docs.google.com/spreadsheets/d/1ycPzz1Mw7dylkRGDqkBJj7B0OoqdGbBM/edit?usp=sharing&ouid=107411067002152538962&rtpof=true&sd=true" class="btn-acesso" target="_blank">
        BAIXAR PDF COMPLETO
    </a>

</div>

</body>
</html>
