<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento de Pesquisa Final</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZK69ZY5VVS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZK69ZY5VVS');
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f0f3f6;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        /* Remove o display do contador visual que falhou */
        .contador-display {
            display: none; 
        }
        
        .btn-acesso {
            display: block;
            width: 80%;
            padding: 15px 30px;
            margin: 50px auto 10px; /* Aumenta margem sem o contador */
            background-color: #e74c3c; 
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn-acesso:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Documento de Pesquisa Final</h1>
    <p>Clique abaixo para baixar o arquivo completo.</p>

    <a href="https://docs.google.com/spreadsheets/d/1ycPzz1Mw7dylkRGDqkBJj7B0OoqdGbBM/edit?usp=sharing&ouid=107411067002152538962&rtpof=true&sd=true" 
       class="btn-acesso" 
       id="pdf-download-link" 
       target="_blank">
        BAIXAR PDF COMPLETO
    </a>

</div>

<script>
    // RASTREIA O CLIQUE NO BOTÃO E ENVIA O EVENTO PARA O GA4
    document.getElementById('pdf-download-link').addEventListener('click', function() {
        if (typeof gtag === 'function') {
            gtag('event', 'download_pdf', {
                'event_category': 'downloads',
                'event_label': 'pdf_pesquisa_completa'
            });
        }
    });
</script>

</body>
</html>
